[package]
name = "cadcraft-dwg"
description = "CADCraft DWG bridge: converts DWG to and from DXF bytes using the acadrust crate (MPL-2.0, used unmodified)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Native builds get parallel processing feature
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acadrust = { git = "https://github.com/redanium/acadrust", features = ["parallel"] }

# WASM builds use minimal features (no parallel processing)
[target.'cfg(target_arch = "wasm32")'.dependencies]
acadrust = { git = "https://github.com/redanium/acadrust", default-features = false }
